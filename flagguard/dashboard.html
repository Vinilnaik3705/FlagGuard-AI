<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlagGuard AI</title><style>
:root{color-scheme:dark;--bg:#0a101b;--panel:#111b2a;--border:#263549;--text:#eef4fc;--muted:#a2b4ca;--accent:#74d9c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:29px}h2{font-size:18px;margin:0 0 15px}p{color:var(--muted)}section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin:16px 0}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,textarea,button{font:inherit;border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text);background:#0c1420}button{cursor:pointer;background:#1c3d40;color:#b5f7e9}button:disabled{opacity:.45;cursor:not-allowed}button.danger{background:#482931;color:#ffc7c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.metric{padding:18px;border:1px solid var(--border);border-radius:9px}.metric strong{display:block;font-size:30px;margin-top:6px}.muted{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c7d9ed;max-height:420px;overflow:auto}textarea{width:100%;min-height:80px}input{max-width:100%;width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.incident{border-top:1px solid var(--border);padding:14px 0}.bar{height:8px;background:#263549;border-radius:4px;overflow:hidden;margin-top:10px}.bar div{height:100%;background:#e69b82}#notice{min-height:1.5em;color:#f1cb87}a{color:var(--accent)}
</style></head><body><main><header><div><h1>FlagGuard AI</h1><p>Feature release intelligence / operations console</p></div><a href="/docs">API documentation</a></header>
<section><h2>Connection</h2><div class="grid"><div><label for="key">FlagGuard API key (memory only)</label><input id="key" type="password" autocomplete="off"></div><div><label for="service">Service</label><input id="service" value="astronomy-payment"></div><div><label for="environment">Environment</label><input id="environment" value="development"></div><div><label for="flag">Feature flag</label><input id="flag" value="new_checkout"></div></div><div class="actions"><button id="refresh">Refresh live data</button></div><p id="notice" role="status">Enter your key and refresh.</p></section>
<section><h2>Live cohort health <small class="muted">/ last 5 minutes</small></h2><div class="grid" id="metrics"></div><p id="recommendation"></p></section>
<section><h2>Ask the agent</h2><textarea id="message" placeholder="Investigate the payment service and explain recent failures"></textarea><div class="actions"><button id="ask">Send command</button></div><pre id="answer" aria-live="polite"></pre><details><summary>Tool execution trace</summary><pre id="trace"></pre></details></section>
<section><h2>Detected incidents and recovery plans</h2><div id="incidents">No data loaded.</div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const node=(tag,value,cls)=>{const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;return n};
async function api(path,method='GET',body){if(!$('key').value)throw Error('Enter API key');const r=await fetch(path,{method,headers:{Authorization:'Bearer '+$('key').value,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',redirect:'error'});if(!r.ok)throw Error('HTTP '+r.status+': '+(await r.text()).slice(0,300));return r.json()}
function notice(s){$('notice').textContent=s}
async function busy(button,fn){button.disabled=true;try{await fn()}catch(e){notice(e.message)}finally{button.disabled=false}}
function button(label,fn,cls){const b=node('button',label,cls);b.addEventListener('click',()=>busy(b,fn));return b}
async function showPlan(container,id){const path='/api/v1/cli-changes/'+encodeURIComponent(id);const plan=await api(path);container.replaceChildren(node('pre',JSON.stringify(plan,null,2)));const actions=node('div','','actions');container.append(actions);if(plan.status==='pending'){for(const approve of [true,false])actions.append(button(approve?'Approve plan':'Reject plan',async()=>{if(!confirm((approve?'Approve ':'Reject ')+plan.feature+' / segment '+(plan.segment_id??'default')+'?'))return;await api(path+'/approval','POST',{approve});await showPlan(container,id)},approve?'':'danger'))}if(plan.status==='approved')actions.append(button('Execute approved change',async()=>{if(!confirm('Execute '+plan.feature+' / segment '+(plan.segment_id??'default')+' to '+plan.target_enabled+'?'))return;const result=await api(path+'/execute','POST');notice(JSON.stringify(result));await showPlan(container,id)},'danger'))}
async function refresh(){const params=new URLSearchParams({service:$('service').value,environment:$('environment').value,flag:$('flag').value});const [data,incidents]=await Promise.all([api('/api/v1/analysis?'+params),api('/api/v1/monitor/incidents')]);$('metrics').replaceChildren();for(const group of ['disabled','enabled']){const g=data.groups[group];const card=node('div','','metric');card.append(node('span',group==='disabled'?'Stable / OFF':'Experimental / ON','muted'),node('strong',g?g.error_rate.toFixed(2)+'%':'No data'),node('div',g?g.requests+' requests / '+g.errors+' errors':'No recent requests'));const bar=node('div','','bar'),fill=node('div','');fill.style.width=(g?Math.min(100,Math.max(0,g.error_rate)):0)+'%';bar.append(fill);card.append(bar);$('metrics').append(card)}$('recommendation').textContent='Recommendation: '+data.recommendation;$('incidents').replaceChildren();if(!incidents.length)$('incidents').append(node('p','No incidents recorded.'));for(const incident of incidents){const r=incident.result||{};const row=node('div','','incident');row.append(node('strong','#'+incident.id+' / '+(r.service||'Monitoring')+' / '+(r.recommendation||r.status||'Unknown')),node('p',new Date(incident.created*1000).toLocaleString()));if(r.explanation)row.append(node('pre',r.explanation));if(r.recovery_error)row.append(node('p',r.recovery_error));if(r.recovery_plan?.id){const panel=node('div','');row.append(button('Review recovery plan',()=>showPlan(panel,r.recovery_plan.id)),panel)}$('incidents').append(row)}notice('Live data refreshed.')}
$('refresh').addEventListener('click',()=>busy($('refresh'),refresh));$('ask').addEventListener('click',()=>busy($('ask'),async()=>{const message=$('message').value.trim();if(!message)throw Error('Enter a command');$('answer').textContent='Request in progress…';try{const result=await api('/api/v1/command','POST',{message});$('answer').textContent=result.answer;$('trace').textContent=JSON.stringify(result.tools,null,2);notice('Agent response received. No configuration change executed.')}catch(e){$('answer').textContent='Command failed.';throw e}}));
</script></body></html>
